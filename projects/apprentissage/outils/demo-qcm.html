<title>Islam pas à pas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* ==========================================================================
   ISLAM PAS A PAS — SYSTEME DE DESIGN
   --------------------------------------------------------------------------
   Toutes les valeurs de ce fichier viennent du cahier des charges, section 3.
   Elles ne sont pas negociables et ne doivent pas etre "ajustees a l'oeil" :
   si une valeur doit changer, elle change d'abord dans le cahier des charges.

   Dessine pour 390 px de large, une seule main, un pouce. Le bureau est une
   adaptation (section 12), jamais le point de depart.
   ========================================================================== */

:root {
  /* --- Fonds ------------------------------------------------------------ */
  --fond-app:        #FAF7F0;   /* toutes les pages sauf le QCM */
  --fond-qcm:        #EFEADF;   /* mode QCM : un ton plus chaud, plus concentre */
  --papier:          #FFFDF8;   /* cartes, blocs, champs */
  --papier-arriere:  #FAF5EA;   /* la carte suivante, derriere la carte active */

  /* --- Vert ------------------------------------------------------------- */
  --vert:            #0F5132;
  --vert-fonce:      #0B3D26;
  --vert-juste:      #2F7A52;
  --vert-voile:      #EAF1EC;
  --vert-voile-2:    #EFF5F1;
  --vert-voile-3:    #EAF3ED;

  /* --- Or ---------------------------------------------------------------- */
  --or:              #C9A227;
  --or-clair:        #E3C97A;
  --or-texte:        #7E6A22;
  --or-texte-2:      #9A7A12;
  --or-voile:        #FBF2D8;
  --or-bordure:      #E8D9A6;
  --sur-or:          #3A2E06;
  --sur-or-2:        #26200A;

  /* --- Rouge ------------------------------------------------------------- */
  --rouge:           #A63D40;
  --rouge-texte:     #7A2A2C;
  --rouge-voile:     #FBEDED;
  --rouge-bordure:   #E7C4C5;

  /* --- Texte ------------------------------------------------------------- */
  --encre:           #1C2620;
  --encre-titre:     #12211A;
  --texte-2:         #55635B;
  --texte-3:         #5F6D66;   /* la limite basse. JAMAIS plus clair sur ivoire. */

  /* --- Traits ------------------------------------------------------------ */
  --trait:           #E6DFD1;
  --trait-2:         #E0D8C7;
  --trait-3:         #DDD6C6;
  --trait-4:         #D6CEBC;
  --trait-5:         #DFD7C7;

  /* --- Sur fond vert fonce ----------------------------------------------- */
  --sur-vert:        #FFFDF8;
  --sur-vert-2:      #B9D2C4;
  --sur-vert-3:      #A9C7B6;
  --sur-vert-4:      #7FA893;
  --sur-vert-5:      #D8E5DD;

  /* --- Polices ----------------------------------------------------------- */
  --titre:  'Marcellus', Georgia, serif;
  --corps:  'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --arabe:  'Amiri', 'Scheherazade New', serif;

  /* --- Geometrie (section 3.3) ------------------------------------------- */
  --marge:        20px;   /* marge laterale de l'ecran */
  --r-carte:      26px;   /* carte de QCM */
  --r-bloc:       14px;   /* bloc / champ : 14 a 18 */
  --r-bloc-2:     18px;
  --r-pastille:   22px;   /* pastille : 15 a 22 */
  --r-lettre:     10px;   /* badge de lettre : 8 a 12 */
  --h-bouton:     56px;
  --r-bouton:     15px;
  --h-bouton-2:   52px;
  --r-bouton-2:   14px;
  --cible:        44px;   /* toute cible tactile, section 2.6 */

  --ombre-carte:  0 14px 34px rgba(28, 38, 32, 0.12);
  --ombre-vert:   0 4px 14px rgba(15, 81, 50, 0.22);
  --ombre-or:     0 4px 14px rgba(201, 162, 39, 0.35);
}

/* ==========================================================================
   REMISE A ZERO
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--fond-app);
  color: var(--encre);
  font-family: var(--corps);
  font-size: 15px;
  line-height: 1.55;
  /* Le QCM se joue au doigt : le navigateur ne doit pas interpreter le geste
     comme un defilement ou un zoom pendant qu'on fait glisser une carte. */
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

/* Le fond passe au ton chaud quand on est dans un QCM. */
body[data-mode="qcm"] { background: var(--fond-qcm); }

h1, h2, h3, p, figure, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }

button, input, select {
  font: inherit;
  color: inherit;
  margin: 0;
}

button {
  background: none;
  border: 0;
  cursor: pointer;
  /* Une cible tactile ne descend jamais sous 44 px (section 2.6). Le controle
     automatique de la recette le verifie sur CHAQUE bouton de CHAQUE ecran. */
  min-height: var(--cible);
  min-width: var(--cible);
}

a { color: var(--vert); text-decoration: none; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--vert);
  outline-offset: 2px;
}

svg { display: block; flex-shrink: 0; }

/* ==========================================================================
   TYPOGRAPHIE (section 3.2)
   ========================================================================== */

.t-page   { font-family: var(--titre); font-size: 29px;   line-height: 1.15; color: var(--encre-titre); }
.t-bandeau{ font-family: var(--titre); font-size: 24px;   line-height: 1.2;  }
.t-question{font-family: var(--titre); font-size: 21px;   line-height: 1.35; color: var(--encre-titre); text-wrap: pretty; }
.t-bloc   { font-family: var(--titre); font-size: 17px;   line-height: 1.25; color: var(--vert-fonce); }
.t-chiffre{ font-family: var(--titre); font-size: 22px;   line-height: 1;    color: var(--vert); }

.c-reponse{ font-size: 14.5px; line-height: 1.3; }
.c-meta   { font-size: 12.5px; color: var(--texte-2); }
.c-sur    { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; }

/* L'arabe : direction droite-a-gauche, jamais deforme, jamais en italique,
   jamais tronque (section 2.10). */
.arabe {
  font-family: var(--arabe);
  font-size: 26px;
  line-height: 1.6;
  direction: rtl;
  font-style: normal;
  font-stretch: normal;
  white-space: normal;
  overflow-wrap: break-word;
}
.arabe-grand { font-size: 28px; }

/* ==========================================================================
   MISE EN PAGE
   --------------------------------------------------------------------------
   Section 3.3 : tout groupe d'elements freres se pose en flex ou grid avec
   gap. Jamais de marges au coup par coup.
   ========================================================================== */

.ecran {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  /* Rien ne doit jamais elargir la page : une seule main, un pouce, et un
     ecran qui ne retrecit pas tout seul. */
  overflow-x: hidden;
}

.corps {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 26px var(--marge) 0 var(--marge);
}

.pile      { display: flex; flex-direction: column; }
.pile-9    { display: flex; flex-direction: column; gap: 9px; }
.pile-11   { display: flex; flex-direction: column; gap: 11px; }
.pile-13   { display: flex; flex-direction: column; gap: 13px; }
.pile-18   { display: flex; flex-direction: column; gap: 18px; }
.pile-22   { display: flex; flex-direction: column; gap: 22px; }
.rang      { display: flex; align-items: center; gap: 10px; }
.rang-entre{ display: flex; align-items: center; justify-content: space-between; }
.pousse    { flex-grow: 1; }

/* ==========================================================================
   BLOCS ET BOUTONS
   ========================================================================== */

.bloc {
  background: var(--papier);
  border: 1px solid var(--trait);
  border-radius: var(--r-bloc);
}

.bouton {
  height: var(--h-bouton);
  border-radius: var(--r-bouton);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  width: 100%;
}
.bouton-vert { background: var(--vert); color: var(--sur-vert); box-shadow: var(--ombre-vert); }
.bouton-or   { background: var(--or);   color: var(--sur-or);   box-shadow: 0 4px 14px rgba(201,162,39,0.28); }
.bouton-2 {
  height: var(--h-bouton-2);
  border-radius: var(--r-bouton-2);
  background: var(--papier);
  border: 1px solid var(--trait-2);
  color: var(--encre);
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
}

.bouton[disabled] { opacity: 0.5; }

/* Pastille ronde d'en-tete : profil, sortie. Toujours 44 px. */
.pastille {
  width: var(--cible);
  height: var(--cible);
  border-radius: var(--r-pastille);
  border: 1px solid var(--trait);
  background: var(--papier);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ==========================================================================
   ACCESSIBILITE
   ========================================================================== */

.invisible {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.saut-contenu {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--vert);
  color: var(--sur-vert);
  padding: 12px 16px;
  border-radius: 0 0 var(--r-bloc) 0;
  z-index: 100;
}
.saut-contenu:focus { left: 0; }

/* Section 7.9 : si la personne a demande moins d'animation, plus de rotation
   ni d'envol. Un simple fondu de 120 ms. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.12s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.12s !important;
    scroll-behavior: auto !important;
  }
}

/* ==========================================================================
   BUREAU (section 12)
   --------------------------------------------------------------------------
   AUCUN element nouveau n'apparait sur grand ecran. On centre, on elargit
   un peu, c'est tout.
   ========================================================================== */

@media (min-width: 900px) {
  .ecran { max-width: 480px; margin: 0 auto; }
}

/* ==========================================================================
   LE QCM — LE PRODUIT
   --------------------------------------------------------------------------
   Ecrans 4 a 7 du cahier des charges. Les valeurs viennent de l'annexe A ;
   quand l'annexe et la section 3 disent la meme chose, c'est la section 3 qui
   est citee (variable). Quand l'annexe donne une valeur qui n'existe pas dans
   la palette, elle est declaree ici et signalee comme telle.
   ========================================================================== */

:root {
  /* Valeur d'annexe A, ecran 4 : fond du badge de lettre au repos. Elle ne
     figure pas dans la palette de la section 3.1 — on ne l'invente pas
     ailleurs, on la nomme ici une fois pour toutes. */
  --badge-repos: #F2EDE2;
  /* Valeur d'annexe A, ecran 4 : le chevron « Passer », plus sourd que le
     texte a cote. Idem, absente de la palette. */
  --chevron-passer: #8A8271;
}

/* --------------------------------------------------------------------------
   Barre haute : sortie, compteur, pastille de serie
   -------------------------------------------------------------------------- */

.qcm-haut {
  padding: 22px var(--marge) 0 var(--marge);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.qcm-barre {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* La croix de sortie fait bien 44 px de cible (section 2.6) ; les marges
   negatives la ramenent visuellement au bord sans retrecir la zone du doigt. */
.qcm-sortir {
  width: var(--cible);
  height: var(--cible);
  margin: -12px 0 -12px -12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.qcm-compte {
  font-size: 13px;
  font-weight: 600;
  color: var(--texte-2);
  font-variant-numeric: tabular-nums;
}

/* --------------------------------------------------------------------------
   La serie (section 8)
   -------------------------------------------------------------------------- */

.serie {
  height: 30px;
  border-radius: 15px;
  background: var(--or-voile);
  border: 1px solid var(--or-bordure);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  transition: background 200ms, border-color 200ms, box-shadow 200ms;
}
.serie span { font-size: 13px; font-weight: 700; color: var(--or-texte); }
.serie svg path { stroke: var(--or-texte-2); }

/* Bonne reponse : la pastille passe en or plein, avec son ombre. */
.serie[data-etat="or"] {
  background: var(--or);
  border-color: var(--or);
  box-shadow: var(--ombre-or);
}
.serie[data-etat="or"] span { color: var(--sur-or); }
.serie[data-etat="or"] svg path { stroke: var(--sur-or); }

/* Mauvaise reponse : elle retombe en gris. Sans animation brusque, sans son,
   sans dramatisation (section 8). */
.serie[data-etat="gris"] {
  background: var(--papier);
  border-color: var(--trait-2);
  box-shadow: none;
}
.serie[data-etat="gris"] span { color: var(--texte-2); font-weight: 600; }
.serie[data-etat="gris"] svg path { stroke: var(--texte-3); }

/* Le chiffre monte de 8 px en 200 ms quand il s'incremente. */
@keyframes monte {
  from { transform: translateY(8px); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}
.serie[data-anime="oui"] span { animation: monte 200ms ease-out; }

/* La serie est desactivable : la pastille disparait, rien d'autre ne change. */
.serie[hidden] { display: none; }

/* --------------------------------------------------------------------------
   La barre segmentee : un segment par question
   -------------------------------------------------------------------------- */

.segments { display: flex; gap: 3px; }
.segments i {
  flex-grow: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--trait-3);          /* a venir */
  transition: background 160ms;
}
.segments i[data-e="juste"]  { background: var(--vert-juste); }
.segments i[data-e="rate"]   { background: var(--rouge); }
.segments i[data-e="encours"]{ background: var(--or); }

/* Au-dela de 30 questions les segments s'affinent ; au-dela de 60 on passe a
   une barre continue avec le compteur chiffre (ecran 4). */
.segments[data-dense="oui"] { gap: 2px; }
.segments[data-dense="oui"] i { height: 3px; }

.jauge {
  height: 4px;
  border-radius: 2px;
  background: var(--trait-3);
  overflow: hidden;
}
.jauge i {
  display: block;
  height: 100%;
  background: var(--vert-juste);
  border-radius: 2px;
  transition: width 160ms;
}

/* --------------------------------------------------------------------------
   La zone des cartes
   -------------------------------------------------------------------------- */

.zone {
  flex-grow: 1;
  position: relative;
  margin-top: 18px;
  /* Le geste appartient a la carte : le navigateur ne doit pas le prendre
     pour un defilement horizontal. */
  touch-action: pan-y;
  /* MESURE, PAS PRECAUTION. Sans ce debordement masque, la carte qui s'envole
     part a 590 px vers la droite et ELARGIT LA PAGE : le navigateur mobile
     redimensionne alors tout pour faire tenir 1 004 px dans 390, et l'ecran
     entier retrecit d'un coup au milieu du jeu. L'annexe A porte bien
     `overflow: hidden` sur l'ecran ; je l'avais laisse tomber en passant aux
     classes. */
  overflow: hidden;
}

/* La carte suivante est DEJA montee dans le DOM (section 7.7) : aucun
   chargement, aucun scintillement entre deux questions. Elle depasse derriere,
   centree, plus etroite de 14 px de chaque cote. */
.carte-arriere {
  position: absolute;
  left: 34px; right: 34px;
  top: 14px; bottom: 24px;
  background: var(--papier-arriere);
  border: 1px solid var(--trait-2);
  border-radius: var(--r-carte);
}

.carte {
  position: absolute;
  left: var(--marge); right: var(--marge);
  top: 0; bottom: 38px;
  background: var(--papier);
  border: 1px solid var(--trait);
  border-radius: var(--r-carte);
  box-shadow: 0 16px 36px rgba(28, 38, 32, 0.13);
  padding: 24px var(--marge);
  display: flex;
  flex-direction: column;
  gap: 16px;
  /* Pose par le geste. Au repos, rien. */
  will-change: transform;
}

.carte-tete {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.carte-surtitre {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--or-texte);
}
.carte-arabe {
  font-family: var(--arabe);
  font-size: 28px;
  color: var(--vert-fonce);
  direction: rtl;
  text-align: right;
  line-height: 1.6;
}

/* --------------------------------------------------------------------------
   Les quatre reponses, en grille 2 x 2
   -------------------------------------------------------------------------- */

.reponses {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.reponse {
  min-height: 96px;
  border: 1px solid var(--trait);
  border-radius: 16px;
  padding: 13px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  width: 100%;
  background: transparent;
  transition: border-color 120ms, background 120ms;
}
.reponse .lettre {
  width: 24px; height: 24px;
  border-radius: 8px;
  background: var(--badge-repos);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--texte-2);
  flex-shrink: 0;
}
.reponse .texte { font-size: 14.5px; line-height: 1.3; }

/* Choisie : bordure verte 2 px, fond voile. La bordure passant de 1 a 2 px,
   on retire 1 px de padding pour que la carte ne bouge pas d'un pixel. */
.reponse[aria-pressed="true"] {
  border: 2px solid var(--vert);
  background: var(--vert-voile-2);
  padding: 12px;
}
.reponse[aria-pressed="true"] .lettre { background: var(--vert); color: var(--sur-vert); }
.reponse[aria-pressed="true"] .texte  { font-weight: 600; color: var(--vert-fonce); }

/* Correction posee sur place (ecran 7). */
.reponse[data-corrige="bonne"] {
  border: 2px solid var(--vert-juste);
  background: var(--vert-voile-3);
  padding: 12px;
}
.reponse[data-corrige="choix"] {
  border: 2px solid var(--rouge);
  background: var(--rouge-voile);
  padding: 12px;
}
.reponse[data-corrige="autre"] { opacity: 0.5; }

.etiquette {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.etiquette[data-t="bonne"] { color: var(--vert-juste); }
.etiquette[data-t="choix"] { color: var(--rouge-texte); }

/* --------------------------------------------------------------------------
   LE GESTE (section 7)
   -------------------------------------------------------------------------- */

/* Au-dela de 60 px de deplacement, l'indice du cote vise apparait. */
.carte[data-vise="droite"] { border-color: var(--vert); border-width: 2px; padding: 23px 19px; }
.carte[data-vise="gauche"] { border-color: var(--texte-3); border-width: 2px; padding: 23px 19px; }

/* Le tampon en travers. Toutes les valeurs viennent de l'annexe A, ecran 5 :
   position 20/92 dans la carte, rotation -11 deg, cadre 3 px, rayon 12 px,
   fond ivoire a 92 %, Marcellus 26 px, interlettrage 3 px.
   Il RECOUVRE volontairement le haut de la carte, comme un tampon sur du
   papier : a ce moment-la, la personne a deja lu et deja choisi. */
.tampon {
  position: absolute;
  top: 92px;
  left: 20px;
  transform: rotate(-11deg);
  padding: 7px 16px;
  border-radius: 12px;
  border: 3px solid var(--vert);
  background: rgba(255, 253, 248, 0.92);
  font-family: var(--titre);
  font-size: 26px;
  letter-spacing: 3px;
  color: var(--vert);
  pointer-events: none;
  opacity: 0;
  transition: opacity 120ms;
}
.tampon[data-t="passer"] { border-color: var(--texte-3); color: var(--texte-3); }
.carte[data-vise] .tampon { opacity: 1; }

/* Retour a sa place quand le seuil n'est pas atteint : 180 ms. */
.carte[data-anime="retour"] { transition: transform 180ms ease-out; }
/* Envol hors ecran quand il l'est : 220 ms, courbe imposee. */
.carte[data-anime="envol"]  { transition: transform 220ms cubic-bezier(.22,.61,.36,1), opacity 220ms; }

/* Droite sans reponse choisie : la carte refuse de partir. Secousse de 6 px,
   150 ms (section 7.5). Ce n'est pas une punition, c'est une reponse au geste. */
@keyframes secousse {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-6px); }
  75%      { transform: translateX(6px); }
}
.carte[data-anime="secousse"] { animation: secousse 150ms ease-in-out; }

/* Section 7.9 : sans animation, plus de rotation ni d'envol. Un fondu. */
@media (prefers-reduced-motion: reduce) {
  .carte { transform: none !important; }
  .carte[data-anime="envol"] { transition: opacity 120ms; opacity: 0; }
  .carte[data-anime="secousse"] { animation: none; }
  /* le tampon garde son inclinaison : elle n'est pas une animation */
}

/* --------------------------------------------------------------------------
   Le pied : legende du geste
   -------------------------------------------------------------------------- */

.qcm-pied {
  padding: 0 var(--marge) 26px var(--marge);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.qcm-pied .cotes {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cote { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.cote-gauche { color: var(--texte-2); }
.cote-droite { color: var(--vert); font-weight: 700; }
.cote svg path { stroke: currentColor; }
.cote-gauche svg path { stroke: var(--chevron-passer); }

/* Le cote vise s'allume en pastille pleine pendant le geste (ecran 5). */
.cote[data-actif="oui"] {
  background: var(--vert);
  color: var(--sur-vert);
  border-radius: 15px;
  padding: 5px 12px;
  margin: -5px -12px;
}
.cote[data-actif="oui"] svg path { stroke: var(--sur-vert); }
/* Le rappel du geste inverse reste visible a 40 % (ecran 5). */
.cote[data-actif="non"] { opacity: 0.4; }

.poignee {
  width: 128px;
  height: 5px;
  border-radius: 3px;
  background: var(--trait-4);
}

/* --------------------------------------------------------------------------
   La feuille de correction qui monte du bas (ecrans 6 et 7)
   -------------------------------------------------------------------------- */

.feuille {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  border-radius: var(--r-carte) var(--r-carte) 0 0;
  padding: 22px var(--marge) 26px var(--marge);
  display: flex;
  flex-direction: column;
  gap: 14px;
  transform: translateY(100%);
  transition: transform 260ms cubic-bezier(.22,.61,.36,1);
  max-height: 78dvh;
  overflow-y: auto;
}
.feuille[data-ouverte="oui"] { transform: translateY(0); }

/* Bonne reponse : feuille vert profond. */
.feuille[data-t="juste"] { background: var(--vert-fonce); color: var(--sur-vert); }
.feuille[data-t="juste"] .f-titre { color: var(--sur-vert); }
.feuille[data-t="juste"] .f-texte { color: var(--sur-vert-5); }
.feuille[data-t="juste"] .f-source,
.feuille[data-t="juste"] .f-note { color: var(--sur-vert-3); }

/* Mauvaise reponse : meme structure, feuille ivoire. Ton oppose. */
.feuille[data-t="rate"] { background: var(--papier); border-top: 1px solid var(--trait); }
.feuille[data-t="rate"] .f-titre { color: var(--encre-titre); }
.feuille[data-t="rate"] .f-texte { color: var(--encre); }
.feuille[data-t="rate"] .f-source,
.feuille[data-t="rate"] .f-note { color: var(--texte-2); }

.f-titre { font-family: var(--titre); font-size: 24px; }
.f-texte { font-size: 15px; line-height: 1.55; }
.f-source { font-size: 12.5px; }
/* Une note n'est pas une source : le record de serie et la promesse de
   retour se lisent pareil mais ne citent rien. Les confondre, c'est se
   priver de tout controle automatique sur la presence des sources. */
.f-note { font-size: 12.5px; }
/* Quand les savants divergent, on affiche la phrase telle quelle. On n'arbitre
   pas (section 5, champ `divergence`). */
.f-divergence {
  font-size: 13px;
  line-height: 1.5;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--or-voile);
  border: 1px solid var(--or-bordure);
  color: var(--or-texte);
}
.feuille[data-t="juste"] .f-divergence {
  background: rgba(201, 162, 39, 0.14);
  border-color: rgba(227, 201, 122, 0.4);
  color: var(--or-clair);
}

/* ==========================================================================
   LES PAGES HORS QCM — ecrans 1, 2, 3, 8, 9
   --------------------------------------------------------------------------
   Valeurs de l'annexe A. Le fond est ivoire (--fond-app) : seul le QCM passe
   au ton chaud.
   ========================================================================== */

/* --------------------------------------------------------------------------
   L'en-tete de page : marque + acces au profil
   -------------------------------------------------------------------------- */

.tete { display: flex; align-items: center; justify-content: space-between; }
.marque { display: flex; align-items: center; gap: 9px; color: var(--or); }
.marque b {
  font-family: var(--titre);
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 0.2px;
  color: var(--vert-fonce);
}

/* --------------------------------------------------------------------------
   La carte de reprise (ecran 1)
   --------------------------------------------------------------------------
   L'anneau montre l'avancement du QCM EN COURS (question 12 sur 50 = 24 %).
   Ce n'est PAS la maitrise de la section, qui est une autre mesure et qui
   s'affiche plus bas en barre. Le cahier des charges insiste : ne pas les
   confondre.
   -------------------------------------------------------------------------- */

.reprise {
  background: var(--vert);
  border-radius: var(--r-bloc-2);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 18px;
  box-shadow: 0 8px 24px rgba(15, 81, 50, 0.18);
  width: 100%;
  text-align: left;
}
.anneau { position: relative; width: 66px; height: 66px; flex-shrink: 0; }
.anneau-pc {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 700;
  color: var(--sur-vert);
}
.reprise .quoi { display: flex; flex-direction: column; gap: 4px; }
.reprise .sur { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--sur-vert-3); }
.reprise .nom { font-family: var(--titre); font-size: 19px; color: var(--sur-vert); }
.reprise .ou  { font-size: 13.5px; color: var(--sur-vert-2); }

/* --------------------------------------------------------------------------
   Les trois chiffres (ecran 1)
   -------------------------------------------------------------------------- */

.chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.chiffre {
  background: var(--papier);
  border: 1px solid var(--trait);
  border-radius: var(--r-bloc);
  padding: 13px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.chiffre b { font-family: var(--titre); font-size: 22px; font-weight: 400; color: var(--vert); }
.chiffre span { font-size: 11.5px; color: var(--texte-2); text-align: center; }

/* --------------------------------------------------------------------------
   Une ligne de section, avec sa barre de maitrise
   -------------------------------------------------------------------------- */

.ligne {
  display: flex;
  align-items: center;
  gap: 13px;
  background: var(--papier);
  border: 1px solid var(--trait);
  border-radius: var(--r-bloc);
  padding: 12px 14px;
  width: 100%;
  text-align: left;
}
.ligne .rond {
  width: 38px; height: 38px;
  border-radius: 11px;
  background: var(--vert-voile);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--vert);
}
.ligne .milieu { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ligne .nom { font-size: 15px; font-weight: 600; }
.ligne .pc { font-size: 12.5px; color: var(--texte-2); flex-shrink: 0; }

.barre { height: 4px; border-radius: 2px; background: var(--trait); }
.barre i { display: block; height: 4px; border-radius: 2px; background: var(--vert); }
/* Sous 10 %, la barre passe en or : un trait vert de trois pixels ne se voit
   pas, et laisser croire a zero quand il y a quelque chose est un mensonge. */
.barre i[data-faible="oui"] { background: var(--or); }

/* --------------------------------------------------------------------------
   La grille des 12 sections (ecran 2)
   -------------------------------------------------------------------------- */

.tuiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.tuile {
  background: var(--papier);
  border: 1px solid var(--trait);
  border-radius: var(--r-bloc-2);
  padding: 15px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  text-align: left;
  min-height: 132px;
}
.tuile .rond {
  width: 36px; height: 36px;
  border-radius: 11px;
  background: var(--vert-voile);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--vert);
}
.tuile .nom { font-size: 14.5px; font-weight: 600; line-height: 1.25; }
.tuile .nb  { font-size: 12px; color: var(--texte-2); }

/* --------------------------------------------------------------------------
   La barre de navigation basse (ecran 1)
   -------------------------------------------------------------------------- */

.nav {
  height: 70px;
  border-top: 1px solid var(--trait);
  background: var(--papier);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  padding-bottom: 6px;
  position: sticky;
  bottom: 0;
}
.nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--texte-3);
  min-height: var(--cible);
  justify-content: center;
}
.nav a[aria-current="page"] { color: var(--vert); font-weight: 600; }

/* --------------------------------------------------------------------------
   L'ornement en separateur (ecran 8)
   -------------------------------------------------------------------------- */

.ornement {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--or);
  padding: 8px 0;
}
.ornement::before, .ornement::after {
  content: "";
  height: 1px;
  width: 54px;
  background: var(--or-bordure);
}

/* ==========================================================================
   LE RESULTAT — ecran 8 du cahier des charges
   ========================================================================== */

.bandeau {
  background: var(--vert-fonce);
  color: var(--sur-vert);
  border-radius: 0 0 var(--r-carte) var(--r-carte);
  padding: 26px var(--marge) 30px var(--marge);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.bandeau .ornement { color: var(--or-clair); }
.bandeau .ornement::before, .bandeau .ornement::after { background: rgba(227, 201, 122, 0.35); }

.grand-anneau { position: relative; width: 168px; height: 168px; }
.grand-anneau-pc {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.grand-anneau-pc b {
  font-family: var(--titre);
  font-size: 48px;
  font-weight: 400;
  line-height: 1;
  color: var(--sur-vert);
}
.grand-anneau-pc span { font-size: 13.5px; color: var(--sur-vert-2); }

.bandeau-mot {
  font-size: 15px;
  line-height: 1.5;
  color: var(--sur-vert-5);
  text-align: center;
  max-width: 300px;
}

.theme { display: flex; flex-direction: column; gap: 6px; }
.theme-nom { font-size: 14.5px; font-weight: 600; }
.barre i[data-ton="vert"]  { background: var(--vert-juste); }
.barre i[data-ton="or"]    { background: var(--or); }
.barre i[data-ton="rouge"] { background: var(--rouge); }


    body { background: var(--fond-qcm); }

5fa7", "section": "sens-des-sourates", "theme": "Reperes", "type": "qcm4", "difficulte": 1, "question": "Combien de versets compte la sourate Al-Kawthar ?", "reponses": ["3 versets", "7 versets", "6 versets", "4 versets"], "bonne": 0, "explication": "La sourate Al-Kawthar porte le numero 108 dans l'ordre du Coran.", "source": "Coran, sourate Al-Kawthar (108).", "divergence": null}, {"id": "sourates-dc2d9e5f", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["et quiconque fait un mal fût-ce du poids d'un atome, le verra", "A titre de récompense de ton Seigneur et à titre de don abondant", "Nous appellerons les gardiens [de l'Enfer]", "Ils y demeureront pendant des siècles successifs"], "bonne": 1, "explication": "C'est le verset 36 de la sourate An-Naba (n° 78). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 78, verset 36. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Naba", "arabe": "جَزَاءً مِنْ رَبِّكَ عَطَاءً حِسَابًا"}, {"id": "sourates-23b51b54", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["Al-Mu'minun", "Al-Buruj", "Az-Zumar", "At-Takathur"], "bonne": 3, "explication": "C'est le verset 5 de la sourate At-Takathur. Sa traduction : « Sûrement! Si vous saviez de science certaine »", "source": "Coran, sourate 102, verset 5.", "divergence": null, "arabe": "كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ"}, {"id": "sourates-f9454f6e", "section": "sens-des-sourates", "theme": "Reperes", "type": "qcm4", "difficulte": 1, "question": "Combien de versets compte la sourate Al-Kafirun ?", "reponses": ["6 versets", "4 versets", "8 versets", "3 versets"], "bonne": 0, "explication": "La sourate Al-Kafirun porte le numero 109 dans l'ordre du Coran.", "source": "Coran, sourate Al-Kafirun (109).", "divergence": null}, {"id": "sourates-eb58aa29", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["du Seigneur des cieux et de la terre et de ce qui existe entre eux, le Tout Miséricordieux; ils n'osent nullement Lui adresser la parole", "toute âme saura alors ce qu'elle a accompli et ce qu'elle a remis de faire à plus tard", "Il ne leur a été commandé, cependant, que d'adorer Allah, Lui vouant un culte exclusif, d'accomplir la Salât et d'acquitter la Zakât. Et voilà la religion de droiture", "et que ce jour-là, on amènera l'Enfer; ce jour-là, l'homme se rappellera. Mais à quoi lui servira de se souvenir"], "bonne": 0, "explication": "C'est le verset 37 de la sourate An-Naba (n° 78). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 78, verset 37. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Naba", "arabe": "رَبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الرَّحْمَٰنِ ۖ لَا يَمْلِكُونَ مِنْهُ خِطَابًا"}, {"id": "sourates-a0b019bf", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["Ash-Shu'ara", "Al-Qari'a", "At-Takathur", "Al-Ahqaf"], "bonne": 2, "explication": "C'est le verset 8 de la sourate At-Takathur. Sa traduction : « Puis, assurément, vous serez interrogés, ce jour-là, sur les délices »", "source": "Coran, sourate 102, verset 8.", "divergence": null, "arabe": "ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ"}, {"id": "sourates-2b9e2975", "section": "sens-des-sourates", "theme": "Reperes", "type": "qcm4", "difficulte": 1, "question": "Combien de versets compte la sourate An-Nasr ?", "reponses": ["5 versets", "3 versets", "7 versets", "6 versets"], "bonne": 1, "explication": "La sourate An-Nasr porte le numero 110 dans l'ordre du Coran.", "source": "Coran, sourate An-Nasr (110).", "divergence": null}, {"id": "sourates-440f8a8c", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["Le jour où aucune âme ne pourra rien en faveur d'une autre âme. Et ce jour-là, le commandement sera à Allah", "laissant un arrière-goût de musc. Que ceux qui la convoitent entrent en compétition [pour l'acquérir]", "Le jour où l'Esprit et les Anges se dresseront en rangs, nul ne saura parler, sauf celui à qui le Tout Miséricordieux aura accordé la permission, et qui dira la vérité", "Mais par contre, quand Il l'éprouve en lui restreignant sa subsistance, il dit: «Mon Seigneur m'a avili»"], "bonne": 2, "explication": "C'est le verset 38 de la sourate An-Naba (n° 78). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 78, verset 38. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Naba", "arabe": "يَوْمَ يَقُومُ الرُّوحُ وَالْمَلَائِكَةُ صَفًّا ۖ لَا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ الرَّحْمَٰنُ وَقَالَ صَوَابًا"}, {"id": "sourates-8b053bdc", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["Al-Falaq", "Al-Fatiha", "Al-Asr", "Ghafir"], "bonne": 2, "explication": "C'est le verset 3 de la sourate Al-Asr. Sa traduction : « sauf ceux qui croient et accomplissent les bonnes œuvres, s'enjoignent mutuellement la vérité et s'enjoignent mutuellement l'endurance »", "source": "Coran, sourate 103, verset 3.", "divergence": null, "arabe": "إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ"}, {"id": "sourates-bacb72b2", "section": "sens-des-sourates", "theme": "Reperes", "type": "qcm4", "difficulte": 1, "question": "Combien de versets compte la sourate Al-Masad ?", "reponses": ["9 versets", "5 versets", "6 versets", "4 versets"], "bonne": 1, "explication": "La sourate Al-Masad porte le numero 111 dans l'ordre du Coran.", "source": "Coran, sourate Al-Masad (111).", "divergence": null}, {"id": "sourates-a08e5a20", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["qu'il (le conseiller) soit un djinn, ou un être humain»", "le jour où les gens se tiendront debout devant le Seigneur de l'Univers", "Encore une fois, qui te dira ce qu'est le jour de la Rétribution", "Ce jour-là est inéluctable. Que celui qui veut prenne donc refuge auprès de son Seigneur"], "bonne": 3, "explication": "C'est le verset 39 de la sourate An-Naba (n° 78). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 78, verset 39. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Naba", "arabe": "ذَٰلِكَ الْيَوْمُ الْحَقُّ ۖ فَمَنْ شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ مَآبًا"}, {"id": "sourates-116367d8", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["Al-Anfal", "Al-Buruj", "Ta-Ha", "Al-Asr"], "bonne": 3, "explication": "C'est le verset 2 de la sourate Al-Asr. Sa traduction : « L'homme est certes, en perdition »", "source": "Coran, sourate 103, verset 2.", "divergence": null, "arabe": "إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ"}, {"id": "sourates-8099ebdf", "section": "sens-des-sourates", "theme": "Reperes", "type": "qcm4", "difficulte": 1, "question": "Combien de versets compte la sourate Al-Ikhlas ?", "reponses": ["5 versets", "7 versets", "3 versets", "4 versets"], "bonne": 3, "explication": "La sourate Al-Ikhlas porte le numero 112 dans l'ordre du Coran.", "source": "Coran, sourate Al-Ikhlas (112).", "divergence": null}, {"id": "sourates-e9a7ed1a", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["Mais, ils le traitèrent de menteur, et la tuèrent. Leur Seigneur les détruisit donc, pour leur péché et étendit Son châtiment sur tous", "Le jour où l'Esprit et les Anges se dresseront en rangs, nul ne saura parler, sauf celui à qui le Tout Miséricordieux aura accordé la permission, et qui dira la vérité", "Quant à l'homme, lorsque son Seigneur l'éprouve en l'honorant et en le comblant de bienfaits, il dit: «Mon Seigneur m'a honoré»", "Nous vous avons avertis d'un châtiment bien proche, le jour où l'homme verra ce que ses deux mains ont préparé; et l'infidèle dira: «Hélas pour moi! Comme j'aurais aimé n'être que poussière»"], "bonne": 3, "explication": "C'est le verset 40 de la sourate An-Naba (n° 78). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 78, verset 40. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Naba", "arabe": "إِنَّا أَنْذَرْنَاكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنْظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ الْكَافِرُ يَا لَيْتَنِي كُنْتُ تُرَابًا"}, {"id": "sourates-1f26bd6e", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["Al-Anbiya", "Al-Humaza", "Al-Mutaffifin", "Ali Imran"], "bonne": 1, "explication": "C'est le verset 4 de la sourate Al-Humaza. Sa traduction : « Mais non! Il sera certes, jeté dans la Hutamah »", "source": "Coran, sourate 104, verset 4.", "divergence": null, "arabe": "كَلَّا ۖ لَيُنْبَذَنَّ فِي الْحُطَمَةِ"}, {"id": "sourates-bed8b201", "section": "sens-des-sourates", "theme": "Reperes", "type": "qcm4", "difficulte": 1, "question": "Combien de versets compte la sourate Al-Falaq ?", "reponses": ["5 versets", "7 versets", "9 versets", "3 versets"], "bonne": 0, "explication": "La sourate Al-Falaq porte le numero 113 dans l'ordre du Coran.", "source": "Coran, sourate Al-Falaq (113).", "divergence": null}, {"id": "sourates-926e771f", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["C'est à Nous, certes, de guider", "consigné dans des feuilles honorées", "Et nul n'est égal à Lui»", "Par ceux qui arrachent violemment"], "bonne": 3, "explication": "C'est le verset 1 de la sourate An-Nazi'at (n° 79). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 79, verset 1. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Nazi'at", "arabe": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالنَّازِعَاتِ غَرْقًا"}, {"id": "sourates-5ac889f3", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["Al-Fil", "Al-Kahf", "Al-Hashr", "Al-Qari'a"], "bonne": 0, "explication": "C'est le verset 4 de la sourate Al-Fil. Sa traduction : « qui leur lançaient des pierres d'argile »", "source": "Coran, sourate 105, verset 4.", "divergence": null, "arabe": "تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ"}, {"id": "sourates-6487a03e", "section": "sens-des-sourates", "theme": "Reperes", "type": "qcm4", "difficulte": 1, "question": "Combien de versets compte la sourate An-Nas ?", "reponses": ["3 versets", "6 versets", "7 versets", "4 versets"], "bonne": 1, "explication": "La sourate An-Nas porte le numero 114 dans l'ordre du Coran.", "source": "Coran, sourate An-Nas (114).", "divergence": null}, {"id": "sourates-7c2172e1", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["Accomplis la Salât pour ton Seigneur et sacrifie", "et nul ne saura garrotter comme Lui garrotte", "quant à celui dont la balance sera lourde", "Et par ceux qui recueillent avec douceur"], "bonne": 3, "explication": "C'est le verset 2 de la sourate An-Nazi'at (n° 79). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 79, verset 2. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Nazi'at", "arabe": "وَالنَّاشِطَاتِ نَشْطًا"}, {"id": "sourates-1622fd95", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["Al-Ma'un", "Al-Fil", "Al-Qadr", "Al-Furqan"], "bonne": 1, "explication": "C'est le verset 2 de la sourate Al-Fil. Sa traduction : « N'a-t-Il pas rendu leur ruse complètement vaine »", "source": "Coran, sourate 105, verset 2.", "divergence": null, "arabe": "أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ"}, {"id": "sourates-10b3dea1", "section": "sens-des-sourates", "theme": "Reperes", "type": "qcm4", "difficulte": 1, "question": "Combien de versets compte la sourate Al-Fatiha ?", "reponses": ["3 versets", "8 versets", "7 versets", "4 versets"], "bonne": 2, "explication": "La sourate Al-Fatiha porte le numero 1 dans l'ordre du Coran.", "source": "Coran, sourate Al-Fatiha (1).", "divergence": null}, {"id": "sourates-75e63362", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["N'a-t-Il pas rendu leur ruse complètement vaine", "Et par ceux qui voguent librement", "Et quant au bienfait de ton Seigneur, proclame-le", "Et qui te dira ce qu'est la nuit d'Al-Qadr"], "bonne": 1, "explication": "C'est le verset 3 de la sourate An-Nazi'at (n° 79). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 79, verset 3. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Nazi'at", "arabe": "وَالسَّابِحَاتِ سَبْحًا"}, {"id": "sourates-2a8e84ed", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["Quraysh", "Al-Hajj", "Al-A'raf", "Ash-Shu'ara"], "bonne": 0, "explication": "C'est le verset 3 de la sourate Quraysh. Sa traduction : « Qu'ils adorent donc le Seigneur de cette Maison [la Ka'ba] »", "source": "Coran, sourate 106, verset 3.", "divergence": null, "arabe": "فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ"}, {"id": "sourates-9c1b4ddf", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["puis s'élancent à toute vitesse", "qui donne ses biens pour se purifier", "et déclare véridique la plus belle récompense", "qui sont pleins d'ostentation"], "bonne": 0, "explication": "C'est le verset 4 de la sourate An-Nazi'at (n° 79). Les trois autres propositions sont des traductions d'autres versets.", "source": "Coran, sourate 79, verset 4. Traduction du sens : Muhammad Hamidullah.", "divergence": null, "surtitre": "Sourate An-Nazi'at", "arabe": "فَالسَّابِقَاتِ سَبْقًا"}, {"id": "sourates-b45844a0", "section": "sens-des-sourates", "theme": "Reconnaitre une sourate", "type": "qcm4", "difficulte": 3, "question": "De quelle sourate vient ce verset ?", "reponses": ["At-Tin", "Quraysh", "Al-An'am", "An-Naba"], "bonne": 1, "explication": "C'est le verset 4 de la sourate Quraysh. Sa traduction : « qui les a nourris contre la faim et rassurés de la crainte »", "source": "Coran, sourate 106, verset 4.", "divergence": null, "arabe": "الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ"}, {"id": "sourates-11230e6a", "section": "sens-des-sourates", "theme": "Le sens des versets", "type": "qcm4", "difficulte": 3, "question": "Ce verset se traduit par :", "reponses": ["Celui qui te hait sera certes, sans postérité", "Le jour où [la terre] tremblera [au premier son du clairon]", "Ils n'y goûteront ni fraîcheur ni breuvage", "et par l'aube quand elle exhale son souffl /* Rend une icone. aria-hidden : une icone ne dit jamais rien qu'un texte a
   cote ne dise deja. */
function icone(nom, taille, classe) {
  var parts = IPAP_ICONES[nom];
  if (!parts) { return ''; }
  var d = '';
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    if (p.t === 'circle') {
      d += '<circle cx="' + p.cx + '" cy="' + p.cy + '" r="' + p.r + '"'
        + ' stroke="currentColor" stroke-width="' + p.w + '" fill="none"/>';
    } else {
      d += '<path d="' + p.d + '" stroke="currentColor" stroke-width="' + p.w + '"'
        + (p.c ? ' stroke-linecap="' + p.c + '"' : '')
        + (p.j ? ' stroke-linejoin="' + p.j + '"' : '') + '/>';
    }
  }
  return '<svg width="' + taille + '" height="' + taille + '" viewBox="0 0 24 24"'
    + ' fill="none" aria-hidden="true"' + (classe ? ' class="' + classe + '"' : '')
    + '>' + d + '</svg>';
}

    if (Array.isArray(d.sessions)) { v.sessions = d.sessions; }
    if (Array.isArray(d.jours)) { v.jours = d.jours.filter(estUnJour); }
    if (d.reprise && typeof d.reprise === 'object') { v.reprise = d.reprise; }
    if (d.reglages && typeof d.reglages === 'object') { v.reglages = d.reglages; }
    if (typeof d.recordSerie === 'number' && d.recordSerie >= 0) { v.recordSerie = d.recordSerie; }
    return v;
  } catch (e) {
    // Navigation privee, stockage plein, JSON abime : on repart propre plutot
    // que de planter. La personne perd sa progression, pas l'application.
    return vide();
  }
}

function ranger(d) {
  try {
    window.localStorage.setItem(CLE, JSON.stringify(d));
    return true;
  } catch (e) {
    return false;
  }
}

function estUnJour(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }

function jourDeAujourdhui() {
  var d = new Date();
  var m = String(d.getMonth() + 1);
  var j = String(d.getDate());
  return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (j.length < 2 ? '0' + j : j);
}

/* --------------------------------------------------------------------------
   Ce qu'on sait d'une question
   -------------------------------------------------------------------------- */

function fiche(d, id) {
  return d.questions[id] || { vues: 0, justes: 0, suite: 0, derniere: null, aRevoir: false, depuis: 0 };
}

/* Enregistre une reponse. `juste` vaut true, false, ou null si la question a
   ete PASSEE — passer n'est ni juste ni faux, et ne casse pas la serie. */
function noter(d, id, juste) {
  var f = fiche(d, id);
  if (juste === null) {
    // Une question passee ne compte pas comme vue : elle n'a pas ete jugee.
    d.questions[id] = f;
    return d;
  }
  f.vues += 1;
  f.derniere = juste;
  if (juste) {
    f.justes += 1;
    f.suite += 1;
    // Trois bonnes reponses consecutives : elle sort du paquet prioritaire.
    if (f.suite >= JUSTES_POUR_SORTIR) { f.aRevoir = false; f.depuis = 0; }
  } else {
    f.suite = 0;
    f.aRevoir = true;
    f.depuis = 0;   // le compteur de QCM prioritaires repart
  }
  d.questions[id] = f;
  return d;
}

/* --------------------------------------------------------------------------
   La maitrise d'une section
   --------------------------------------------------------------------------
   Pourcentage de ses questions dont la DERNIERE reponse est juste (section 9).
   Attention : le denominateur est le nombre TOTAL de questions de la section,
   pas le nombre de questions vues. Sinon quelqu'un qui a repondu juste a une
   seule question sur quatre cents afficherait 100 % de maitrise.
   -------------------------------------------------------------------------- */
function maitrise(d, idsDeLaSection) {
  if (!idsDeLaSection.length) { return 0; }
  var n = 0;
  for (var i = 0; i < idsDeLaSection.length; i++) {
    if (fiche(d, idsDeLaSection[i]).derniere === true) { n += 1; }
  }
  return Math.round(n * 100 / idsDeLaSection.length);
}

/* --------------------------------------------------------------------------
   La serie de jours
   --------------------------------------------------------------------------
   Elle s'incremente des qu'un QCM d'au moins 10 questions est termine dans la
   journee. On la RECALCULE a partir de la liste des jours : jamais stockee.
   -------------------------------------------------------------------------- */
function serieDeJours(d, aujourdhui) {
  var jours = {};
  for (var i = 0; i < d.jours.length; i++) { jours[d.jours[i]] = true; }
  var n = 0;
  var curseur = new Date(aujourdhui + 'T12:00:00');
  // Si rien aujourd'hui, la serie peut quand meme courir jusqu'a hier.
  if (!jours[aujourdhui]) { curseur.setDate(curseur.getDate() - 1); }
  for (;;) {
    var m = String(curseur.getMonth() + 1), j = String(curseur.getDate());
    var cle = curseur.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-'
      + (j.length < 2 ? '0' + j : j);
    if (!jours[cle]) { break; }
    n += 1;
    curseur.setDate(curseur.getDate() - 1);
  }
  return n;
}

function marquerLeJour(d, total) {
  if (total < MINI_POUR_LE_JOUR) { return d; }
  var j = jourDeAujourdhui();
  if (d.jours.indexOf(j) < 0) { d.jours.push(j); }
  return d;
}

/* --------------------------------------------------------------------------
   Les questions a revoir, toutes sections confondues
   -------------------------------------------------------------------------- */
function aRevoir(d) {
  var out = [];
  for (var id in d.questions) {
    if (Object.prototype.hasOwnProperty.call(d.questions, id) && d.questions[id].aRevoir) {
      out.push(id);
    }
  }
  return out;
}

/* Une question `aRevoir` est prioritaire dans les TROIS QCM suivants de sa
   section. On compte ces QCM ici, a la fin de chaque session. */
function vieillirLesPriorites(d, idsJoues) {
  for (var i = 0; i < idsJoues.length; i++) {
    var f = d.questions[idsJoues[i]];
    if (f && f.aRevoir) {
      f.depuis = (f.depuis || 0) + 1;
      if (f.depuis >= QCM_PRIORITAIRES) { f.aRevoir = false; f.depuis = 0; }
    }
  }
  return d;
}

/* --------------------------------------------------------------------------
   Export / import — la seule sauvegarde possible sans compte (section 9)
   -------------------------------------------------------------------------- */
function exporter(d) {
  return JSON.stringify(d, null, 2);
}

function importer(texte) {
  var d = JSON.parse(texte);            // laisse remonter l'erreur : l'appelant previent
  if (!d || typeof d !== 'object') { throw new Error('fichier illisible'); }
  if (!d.questions || typeof d.questions !== 'object') { throw new Error('ce fichier ne contient pas de progression'); }
  return d;
}

window.IPAP_MEMOIRE = {
  CLE: CLE,
  RETOUR_RATE: RETOUR_RATE,
  RETOUR_PASSE: RETOUR_PASSE,
  MINI_POUR_LE_JOUR: MINI_POUR_LE_JOUR,
  vide: vide,
  charger: charger,
  ranger: ranger,
  fiche: fiche,
  noter: noter,
  maitrise: maitrise,
  serieDeJours: serieDeJours,
  marquerLeJour: marquerLeJour,
  jourDeAujourdhui: jourDeAujourdhui,
  aRevoir: aRevoir,
  vieillirLesPriorites: vieillirLesPriorites,
  exporter: exporter,
  importer: importer
};

/* ==========================================================================
   LE GESTE — section 7 du cahier des charges
   --------------------------------------------------------------------------
   C'est le coeur du produit. Chaque valeur ci-dessous vient du cahier des
   charges et n'est pas a « ajuster au feeling » :

     rotation      deltaX / 18, plafonnee a 8 degres
     indice        au-dela de 60 px
     validation    100 px, OU une vitesse de plus de 0,4 px/ms
     envol         220 ms, cubic-bezier(.22,.61,.36,1)
     retour        180 ms
     secousse      6 px, 150 ms
     vibration     10 ms au seuil, 25 ms sur une bonne reponse

   Droite = je valide ma reponse. Gauche = je passe.
   ========================================================================== */

'use strict';

var SEUIL_INDICE = 60;      // px : a partir d'ou le tampon apparait
var SEUIL_VALIDE = 100;     // px : a partir d'ou la carte part
var VITESSE_VALIDE = 0.4;   // px/ms : un geste rapide suffit, meme court
var ROTATION_DIV = 18;      // deltaX / 18 degres
var ROTATION_MAX = 8;       // plafond, en degres
var VIBRE_SEUIL = 10;       // ms
var VIBRE_JUSTE = 25;       // ms

/* La vibration ne doit JAMAIS faire planter la page : l'API n'existe pas
   partout, et sur iOS elle est absente. On l'appelle donc toujours ainsi. */
function vibrer(ms) {
  try {
    if (navigator && typeof navigator.vibrate === 'function') { navigator.vibrate(ms); }
  } catch (e) { /* silencieux : une vibration ratee n'est pas une erreur */ }
}

function moinsDAnimation() {
  try {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { return false; }
}

/* --------------------------------------------------------------------------
   Attache le geste a une carte.

   options.peutValider()  -> vrai si une reponse est choisie
   options.onValider()    -> appelee quand la carte part a droite
   options.onPasser()     -> appelee quand la carte part a gauche
   options.onRefus()      -> appelee quand on tente de valider sans reponse
   -------------------------------------------------------------------------- */
function poserGeste(carte, options) {
  var enCours = false, depart = 0, departY = 0, dx = 0, t0 = 0, parti = false;
  var pointeur = null;

  function dessiner(x) {
    if (moinsDAnimation()) { return; }   // ni rotation ni deplacement
    var deg = Math.max(-ROTATION_MAX, Math.min(ROTATION_MAX, x / ROTATION_DIV));
    carte.style.transform = 'translateX(' + x + 'px) rotate(' + deg + 'deg)';
  }

  function viser(x) {
    var avant = carte.getAttribute('data-vise');
    var vise = null;
    if (x > SEUIL_INDICE) { vise = 'droite'; }
    else if (x < -SEUIL_INDICE) { vise = 'gauche'; }

    if (vise) { carte.setAttribute('data-vise', vise); }
    else { carte.removeAttribute('data-vise'); }

    // Vibration au FRANCHISSEMENT du seuil, pas pendant tout le glissement.
    if (vise && vise !== avant) { vibrer(VIBRE_SEUIL); }

    var g = carte.querySelector('.tampon[data-t="passer"]');
    var d = carte.querySelector('.tampon[data-t="valider"]');
    if (g) { g.style.opacity = vise === 'gauche' ? '1' : '0'; }
    if (d) { d.style.opacity = vise === 'droite' ? '1' : '0'; }

    if (options.onViser) { options.onViser(vise); }
  }

  function relacher() {
    carte.removeAttribute('data-vise');
    var g = carte.querySelector('.tampon[data-t="passer"]');
    var d = carte.querySelector('.tampon[data-t="valider"]');
    if (g) { g.style.opacity = '0'; }
    if (d) { d.style.opacity = '0'; }
    if (options.onViser) { options.onViser(null); }
  }

  function revenir() {
    carte.setAttribute('data-anime', 'retour');
    carte.style.transform = '';
    relacher();
    window.setTimeout(function () { carte.removeAttribute('data-anime'); }, 180);
  }

  function refuser() {
    // Droite sans reponse choisie : la carte ne part pas (section 7.5).
    carte.style.transform = '';
    relacher();
    carte.setAttribute('data-anime', 'secousse');
    window.setTimeout(function () { carte.removeAttribute('data-anime'); }, 150);
    if (options.onRefus) { options.onRefus(); }
  }

  function envoler(vers) {
    if (parti) { return; }
    parti = true;
    relacher();
    carte.setAttribute('data-anime', 'envol');
    if (!moinsDAnimation()) {
      var loin = vers === 'droite' ? window.innerWidth + 200 : -(window.innerWidth + 200);
      carte.style.transform = 'translateX(' + loin + 'px) rotate('
        + (vers === 'droite' ? ROTATION_MAX : -ROTATION_MAX) + 'deg)';
    }
    carte.style.opacity = '0';
    window.setTimeout(function () {
      if (vers === 'droite') { options.onValider(); } else { options.onPasser(); }
    }, moinsDAnimation() ? 120 : 220);
  }

  /* --- Les pointeurs : doigt, souris, stylet, tous par la meme porte ------ */

  function debut(e) {
    if (parti) { return; }
    // On ne demarre pas un glissement depuis un bouton de reponse : on doit
    // pouvoir toucher une reponse pour la choisir sans lancer la carte.
    if (e.target.closest && e.target.closest('button')) { return; }
    enCours = true;
    pointeur = e.pointerId;
    depart = e.clientX;
    departY = e.clientY;
    dx = 0;
    t0 = e.timeStamp;
    carte.removeAttribute('data-anime');
    try { carte.setPointerCapture(e.pointerId); } catch (err) { /* sans capture, ca marche quand meme */ }
  }

  function bouge(e) {
    if (!enCours || e.pointerId !== pointeur) { return; }
    dx = e.clientX - depart;
    var dy = e.clientY - departY;
    // Un geste nettement vertical, c'est un defilement : on rend la main.
    if (Math.abs(dy) > Math.abs(dx) * 1.6 && Math.abs(dx) < SEUIL_INDICE) { return; }
    dessiner(dx);
    viser(dx);
  }

  function fin(e) {
    if (!enCours || (e.pointerId !== undefined && e.pointerId !== pointeur)) { return; }
    enCours = false;
    var duree = Math.max(1, e.timeStamp - t0);
    var vitesse = Math.abs(dx) / duree;
    var assez = Math.abs(dx) >= SEUIL_VALIDE || vitesse > VITESSE_VALIDE;

    // Un geste rapide mais minuscule n'est pas une intention : sous le seuil
    // de l'indice, on considere que la personne n'a pas voulu lancer la carte.
    if (assez && Math.abs(dx) >= SEUIL_INDICE) {
      if (dx > 0) {
        if (options.peutValider()) { envoler('droite'); } else { refuser(); }
      } else {
        envoler('gauche');
      }
    } else {
      revenir();
    }
    dx = 0;
  }

  carte.addEventListener('pointerdown', debut);
  carte.addEventListener('pointermove', bouge);
  carte.addEventListener('pointerup', fin);
  carte.addEventListener('pointercancel', function (e) {
    if (!enCours) { return; }
    enCours = false; dx = 0; revenir();
  });

  /* --- Clavier (section 7.9) --------------------------------------------- */
  return {
    valider: function () {
      if (options.peutValider()) { envoler('droite'); } else { refuser(); }
    },
    passer: function () { envoler('gauche'); },
    detruire: function () {
      carte.removeEventListener('pointerdown', debut);
      carte.removeEventListener('pointermove', bouge);
      carte.removeEventListener('pointerup', fin);
    }
  };
}

window.IPAP_GESTE = { poser: poserGeste, vibrer: vibrer, VIBRE_JUSTE: VIBRE_JUSTE };

/* ==========================================================================
   LE MOTEUR DU QCM — ecrans 4 a 7 du cahier des charges
   --------------------------------------------------------------------------
   Le QCM n'est plus une annexe des lecons. Le QCM EST le produit (section 1).

   Ce fichier tient la session : le paquet de cartes, la carte courante, la
   serie, la correction, et le passage au resultat. Le geste vit dans
   geste.js, la memoire dans memoire.js. Ici, on orchestre.
   ========================================================================== */

'use strict';

var M = window.IPAP_MEMOIRE;
var G = window.IPAP_GESTE;

var LETTRES = ['A', 'B', 'C', 'D'];

function $(id) { return document.getElementById(id); }

function echapper(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function melanger(l, rng) {
  var a = l.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor((rng ? rng() : Math.random()) * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ==========================================================================
   LA SESSION
   ========================================================================== */

function Session(questions, reglages, section) {
  this.reglages = reglages;
  this.section = section;
  this.paquet = questions.slice();   // ce qui reste a jouer, dans l'ordre
  this.pos = 0;
  this.total = questions.length;     // le nombre ANNONCE, celui de la barre
  this.reponses = [];                // { id, choix, juste, passee }
  this.serie = 0;
  this.record = M.charger().recordSerie || 0;
  this.debut = Date.now();
  this.vues = {};                    // id -> nombre de passages dans CETTE session
}

/* Une question ratee revient 8 cartes plus loin ; une question passee, 4
   (section 9). Si le paquet est plus court que ca, elle revient a la fin :
   la promesse « cette question reviendra » doit rester vraie, sinon on ment
   a l'ecran de correction. */
Session.prototype.remettre = function (q, dans) {
  var cible = Math.min(this.pos + dans, this.paquet.length);
  this.paquet.splice(cible, 0, q);
};

Session.prototype.courante = function () { return this.paquet[this.pos] || null; };
Session.prototype.suivante = function () { return this.paquet[this.pos + 1] || null; };

Session.prototype.finie = function () { return this.pos >= this.paquet.length; };

/* ==========================================================================
   L'AFFICHAGE D'UNE CARTE
   ========================================================================== */

function carteHTML(q, avecTampons) {
  if (!q) { return ''; }
  var h = '';
  h += '<div class="carte-tete">';
  h += '<span class="carte-surtitre">' + echapper(q.surtitre || q.theme || '') + '</span>';
  h += icone('signet', 18, 'signet-or');
  h += '</div>';
  if (q.arabe) {
    h += '<div class="carte-arabe" lang="ar" dir="rtl">' + echapper(q.arabe) + '</div>';
  }
  h += '<div class="t-question">' + echapper(q.question) + '</div>';
  h += '<div class="pousse"></div>';
  h += '<div class="reponses" role="group" aria-label="Les quatre reponses">';
  for (var i = 0; i < q.reponses.length; i++) {
    h += '<button type="button" class="reponse" data-i="' + i + '" aria-pressed="false">'
      + '<span class="lettre" aria-hidden="true">' + LETTRES[i] + '</span>'
      + '<span class="texte">' + echapper(q.reponses[i]) + '</span>'
      + '</button>';
  }
  h += '</div>';
  if (avecTampons) {
    h += '<div class="tampon" data-t="valider">VALIDER</div>';
    h += '<div class="tampon" data-t="passer">PASSER</div>';
  }
  return h;
}

/* ==========================================================================
   LE JEU
   ========================================================================== */

function Jeu(racine, session) {
  this.r = racine;
  this.s = session;
  this.choix = null;      // index choisi sur la carte courante
  this.geste = null;
  this.verrou = false;    // vrai pendant une correction : plus rien ne bouge
}

Jeu.prototype.demarrer = function () {
  var self = this;
  document.body.setAttribute('data-mode', 'qcm');
  this.dessinerSegments();
  this.dessinerCarte();
  this.clavier();
  $('qcm-sortir').addEventListener('click', function () { self.sortir(); });
};

/* --- La barre segmentee (ecran 4) ------------------------------------- */
Jeu.prototype.dessinerSegments = function () {
  var zone = $('qcm-progres');
  var n = this.s.total;
  // Au-dela de 60 questions, on passe a une barre continue avec le compteur
  // chiffre : soixante segments de 4 px ne se lisent plus, ils se devinent.
  if (n > 60) {
    zone.innerHTML = '<div class="jauge"><i style="width:' +
      Math.round(this.s.pos * 100 / n) + '%"></i></div>';
    return;
  }
  var h = '<div class="segments"' + (n > 30 ? ' data-dense="oui"' : '') + '>';
  for (var i = 0; i < n; i++) { h += '<i></i>'; }
  zone.innerHTML = h + '</div>';
  this.majSegments();
};

Jeu.prototype.majSegments = function () {
  var n = this.s.total;
  if (n > 60) {
    var b = this.r.querySelector('.jauge i');
    if (b) { b.style.width = Math.round(this.s.pos * 100 / n) + '%'; }
    return;
  }
  var seg = this.r.querySelectorAll('.segments i');
  for (var i = 0; i < seg.length; i++) {
    var rep = this.s.reponses[i];
    if (rep && rep.juste === true) { seg[i].setAttribute('data-e', 'juste'); }
    else if (rep && rep.juste === false) { seg[i].setAttribute('data-e', 'rate'); }
    else if (i === this.s.reponses.length) { seg[i].setAttribute('data-e', 'encours'); }
    else { seg[i].removeAttribute('data-e'); }
  }
};

/* --- La serie (section 8) ---------------------------------------------- */
Jeu.prototype.majSerie = function (etat, anime) {
  var p = $('qcm-serie');
  if (!this.s.reglages.serie) { p.hidden = true; return; }
  p.hidden = false;
  p.querySelector('span').textContent = this.s.serie + " d'affilée";
  if (etat) { p.setAttribute('data-etat', etat); } else { p.removeAttribute('data-etat'); }
  if (anime) {
    p.setAttribute('data-anime', 'oui');
    window.setTimeout(function () { p.removeAttribute('data-anime'); }, 220);
  }
};

/* --- Poser la carte courante ------------------------------------------- */
Jeu.prototype.dessinerCarte = function () {
  var self = this;
  var q = this.s.courante();
  if (!q) { this.terminer(); return; }

  this.choix = null;
  this.verrou = false;

  $('qcm-compte').textContent = (this.s.reponses.length + 1) + ' / ' + this.s.total;
  this.majSerie(null, false);

  // La carte SUIVANTE est deja montee dans le DOM (section 7.7) : aucun
  // chargement, aucun scintillement entre deux questions.
  $('carte-arriere').innerHTML = '';

  var carte = $('carte');
  carte.style.transform = '';
  carte.style.opacity = '';
  carte.removeAttribute('data-anime');
  carte.removeAttribute('data-vise');
  carte.innerHTML = carteHTML(q, true);

  var boutons = carte.querySelectorAll('.reponse');
  for (var i = 0; i < boutons.length; i++) {
    boutons[i].addEventListener('click', function () {
      if (self.verrou) { return; }
      self.choisir(parseInt(this.getAttribute('data-i'), 10));
    });
  }

  if (this.geste) { this.geste.detruire(); }
  this.geste = G.poser(carte, {
    peutValider: function () { return self.choix !== null; },
    onValider: function () { self.valider(); },
    onPasser: function () { self.passer(); },
    onRefus: function () { self.dire('Choisis une réponse avant de valider.'); },
    onViser: function (v) { self.viser(v); }
  });

  this.majSegments();
};

Jeu.prototype.viser = function (v) {
  var g = $('cote-gauche'), d = $('cote-droite');
  if (!v) { g.removeAttribute('data-actif'); d.removeAttribute('data-actif'); return; }
  g.setAttribute('data-actif', v === 'gauche' ? 'oui' : 'non');
  d.setAttribute('data-actif', v === 'droite' ? 'oui' : 'non');
};

Jeu.prototype.choisir = function (i) {
  this.choix = i;
  var b = this.r.querySelectorAll('.reponse');
  for (var k = 0; k < b.length; k++) {
    b[k].setAttribute('aria-pressed', k === i ? 'true' : 'false');
  }
};

/* --- Valider, passer ---------------------------------------------------- */

Jeu.prototype.valider = function () {
  var q = this.s.courante();
  var juste = this.choix === q.bonne;
  this.s.reponses.push({ id: q.id, choix: this.choix, juste: juste, passee: false });

  if (juste) {
    this.s.serie += 1;
    if (this.s.serie > this.s.record) { this.s.record = this.s.serie; }
    G.vibrer(G.VIBRE_JUSTE);
  } else {
    this.s.serie = 0;
    // Une question ratee revient 8 cartes plus loin, dans CETTE session.
    this.s.remettre(q, M.RETOUR_RATE);
  }

  var d = M.charger();
  M.noter(d, q.id, juste);
  if (this.s.record > (d.recordSerie || 0)) { d.recordSerie = this.s.record; }
  M.ranger(d);

  this.s.pos += 1;
  this.majSegments();

  // Mode examen : aucun indice, tout le corrige a la fin (ecran 3).
  if (this.s.reglages.mode === 'examen') {
    this.majSerie(juste ? 'or' : 'gris', juste);
    this.dessinerCarte();
    return;
  }
  this.corriger(q, juste);
};

Jeu.prototype.passer = function () {
  var q = this.s.courante();
  // Passer n'est ni juste ni faux, et ne casse pas la serie (section 7.6).
  this.s.remettre(q, M.RETOUR_PASSE);
  this.s.pos += 1;
  this.dessinerCarte();
};

/* --- La feuille de correction (ecrans 6 et 7) --------------------------- */

Jeu.prototype.corriger = function (q, juste) {
  var self = this;
  this.verrou = true;
  this.majSerie(juste ? 'or' : 'gris', juste);

  // La grille est corrigee SUR PLACE (ecran 7).
  var b = this.r.querySelectorAll('.reponse');
  for (var k = 0; k < b.length; k++) {
    if (k === q.bonne) {
      b[k].setAttribute('data-corrige', 'bonne');
      if (!juste) { b[k].insertAdjacentHTML('beforeend', '<span class="etiquette" data-t="bonne">la bonne</span>'); }
    } else if (k === this.choix) {
      b[k].setAttribute('data-corrige', 'choix');
      b[k].insertAdjacentHTML('beforeend', '<span class="etiquette" data-t="choix">ton choix</span>');
    } else {
      b[k].setAttribute('data-corrige', 'autre');
    }
  }

  var f = $('feuille');
  var h = '';
  h += '<div class="rang" style="gap:10px">';
  h += juste ? icone('coche', 22, 'coche-or') : '';
  h += '<span class="f-titre">' + (juste ? 'Bonne réponse' : 'Pas tout à fait') + '</span>';
  h += '</div>';
  if (juste && this.s.reglages.serie && this.s.record > 0) {
    h += '<div class="f-note">Ta meilleure série est de ' + this.s.record + '.</div>';
  }
  h += '<div class="f-texte">' + echapper(q.explication) + '</div>';
  if (q.divergence) {
    // On affiche la phrase telle quelle. On n'arbitre pas (section 5).
    h += '<div class="f-divergence">Les savants divergent : ' + echapper(q.divergence) + '</div>';
  }
  h += '<div class="f-source">' + echapper(q.source) + '</div>';
  if (!juste) {
    // Cette phrase doit etre VRAIE : la question a bien ete remise dans le
    // paquet, huit cartes plus loin (section 9).
    h += '<div class="f-note">Cette question reviendra plus tard dans le QCM.</div>';
  }
  h += '<button type="button" class="bouton ' + (juste ? 'bouton-or' : 'bouton-vert')
    + '" id="f-suite">Continuer</button>';

  f.setAttribute('data-t', juste ? 'juste' : 'rate');
  f.innerHTML = h;
  f.setAttribute('data-ouverte', 'oui');
  this.dire(juste ? 'Bonne réponse. ' + q.explication : 'Réponse fausse. ' + q.explication);

  $('f-suite').addEventListener('click', function () { self.continuer(); });
  $('f-suite').focus();
};

Jeu.prototype.continuer = function () {
  var f = $('feuille');
  f.removeAttribute('data-ouverte');
  this.dessinerCarte();
};

/* --- Fin de partie ------------------------------------------------------ */

Jeu.prototype.terminer = function () {
  var d = M.charger();
  var joues = [];
  for (var i = 0; i < this.s.reponses.length; i++) { joues.push(this.s.reponses[i].id); }
  M.vieillirLesPriorites(d, joues);
  M.marquerLeJour(d, this.s.reponses.length);
  d.reprise = null;
  var id = 's' + Date.now();
  d.sessions.push({
    id: id,
    section: this.s.section,
    jour: M.jourDeAujourdhui(),
    total: this.s.reponses.length,
    justes: this.s.reponses.filter(function (r) { return r.juste; }).length,
    duree: Math.round((Date.now() - this.s.debut) / 1000),
    detail: this.s.reponses
  });
  M.ranger(d);
  window.location.href = 'resultat.html?s=' + id;
};

Jeu.prototype.sortir = function () {
  // Un QCM interrompu est repris a la question exacte (section 9).
  var d = M.charger();
  d.reprise = {
    section: this.s.section,
    ids: this.s.paquet.map(function (q) { return q.id; }),
    pos: this.s.pos,
    total: this.s.total,
    reponses: this.s.reponses,
    reglages: this.s.reglages,
    debut: this.s.debut
  };
  M.ranger(d);
  window.location.href = 'index.html';
};

/* --- Clavier et annonces (section 7.9) ---------------------------------- */

Jeu.prototype.dire = function (texte) {
  var z = $('qcm-annonce');
  if (z) { z.textContent = texte; }
};

Jeu.prototype.clavier = function () {
  var self = this;
  document.addEventListener('keydown', function (e) {
    if (self.verrou) {
      if (e.key === 'Enter') { e.preventDefault(); self.continuer(); }
      return;
    }
    if (e.key >= '1' && e.key <= '4') {
      e.preventDefault();
      self.choisir(parseInt(e.key, 10) - 1);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      self.geste.valider();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      self.geste.passer();
    }
  });
};

(function () {

      (M.fiche(d, IPAP_BANQUE[i].id).aRevoir ? revoir : reste).push(IPAP_BANQUE[i]);
    }

    // Dans la demonstration, la fin de partie ne change pas de page : il n'y

    jeu.terminer = function () {
      var s = this.s;
      var dernier = {}, bute = {}, ordre = [];
      for (var i = 0; i < s.reponses.length; i++) {
        var r = s.reponses[i];
        if (!Object.prototype.hasOwnProperty.call(dernier, r.id)) { ordre.push(r.id); }
        dernier[r.id] = r;
        if (r.juste === false) { bute[r.id] = true; }
      }
      var justes = 0;
      for (var k = 0; k < ordre.length; k++) { if (dernier[ordre[k]].juste) { justes += 1; } }
      var n = ordre.length, pc = n ? Math.round(justes * 100 / n) : 0;
      var butes = 0;
      for (var b in bute) { if (Object.prototype.hasOwnProperty.call(bute, b)) { butes += 1; } }
      var c = 2 * Math.PI * 76, pris = pc / 100 * c;
      document.getElementById('fin').innerHTML =

        + '<div class="grand-anneau"><svg width="168" height="168" viewBox="0 0 168 168" aria-hidden="true">'
        + '<circle cx="84" cy="84" r="76" fill="none" stroke="rgba(255,253,248,0.18)" stroke-width="9"/>'
        + '<circle cx="84" cy="84" r="76" fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round"'
        + ' stroke-dasharray="' + pris.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 84 84)"/></svg>'
        + '<div class="grand-anneau-pc"><b>' + pc + '%</b><span>' + justes + ' sur ' + n + '</span></div></div></div>'
        + '<div class="corps"><div class="chiffres">'
        + '<div class="chiffre"><b>' + justes + '</b><span>justes</span></div>'
        + '<div class="chiffre"><b>' + butes + '</b><span>' + (butes > 1 ? 'ont' : 'a')

        + '<div class="chiffre"><b>' + n + '</b><span>questions</span></div></div>'
        + '<button type="button" class="bouton bouton-vert" id="rejouer">Rejouer vingt questions</button>'
        + '<div class="ornement">' + icone('etoile', 15) + '</div></div>';
      document.getElementById('fin').hidden = false;
      document.getElementById('ecran-qcm').hidden = true;
      document.getElementById('rejouer').addEventListener('click', function () {
        document.getElementById('fin').hidden = true;
        document.getElementById('ecran-qcm').hidden = false;
        demarrer();
      });
    };
    jeu.sortir = function () { jeu.terminer(); };
    jeu.demarrer();
  }
  demarrer();
}());
