<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le QCM — Islam pas à pas</title>
<meta name="description" content="Réponds aux questions en faisant défiler les cartes au doigt. Chaque correction est sourcée.">
<meta name="theme-color" content="#EFEADF">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap"></noscript>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/qcm.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%274%27 fill=%27%230B3D26%27/%3E%3Cpath d=%27M12 1.6l2.7 5 5.6-2.5-2.5 5.6 5 2.7-5 2.7 2.5 5.6-5.6-2.5-2.7 5-2.7-5-5.6 2.5 2.5-5.6-5-2.7 5-2.7-2.5-5.6 5.6 2.5z%27 fill=%27none%27 stroke=%27%23C9A227%27 stroke-width=%271.4%27/%3E%3C/svg%3E">
</head>
<body data-mode="qcm">

<div class="ecran" id="ecran-qcm">

  <!-- Le fond carrele (V2 section 3.4) : vert a 5,5 %, tuile 64, R 15.
       Il est pose AVANT le contenu, en absolu sous lui, muet pour les
       lecteurs d'ecran et transparent au doigt. -->
  <div class="fond-motif" data-carrelage="#0F5132" data-op="0.055"
       data-tuile="64" data-r="15" aria-hidden="true"></div>

  <!-- Barre haute : sortie, compteur, serie -->
  <div class="qcm-haut">
    <div class="qcm-barre">
      <button type="button" class="qcm-sortir" id="qcm-sortir" aria-label="Quitter le QCM">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#55635B" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="qcm-compte" id="qcm-compte">1 / 20</span>
      <div class="pousse"></div>
      <div class="serie" id="qcm-serie" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.6l2.7 5 5.6-2.5-2.5 5.6 5 2.7-5 2.7 2.5 5.6-5.6-2.5-2.7 5-2.7-5-5.6 2.5 2.5-5.6-5-2.7 5-2.7-2.5-5.6 5.6 2.5z" stroke="#9A7A12" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>0 d'affilée</span>
      </div>
    </div>
    <div id="qcm-progres"></div>
  </div>

  <!-- La zone des cartes -->
  <div class="zone" id="zone">
    <div class="carte-arriere" id="carte-arriere"></div>
    <div class="carte" id="carte"></div>
  </div>

  <!-- La legende du geste -->
  <div class="qcm-pied">
    <div class="cotes">
      <!-- Ce sont de VRAIS boutons, pas une legende. Ils etaient des <div> :
           au doigt on fait glisser la carte, mais a la souris rien ne dit
           qu'il faut la trainer, et un element qui affiche « Valider » doit
           valider quand on appuie dessus. -->
      <button type="button" class="cote cote-gauche" id="cote-gauche">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.5 9.5L12 16l6.5-6.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Passer</span>
      </button>
      <button type="button" class="cote cote-droite" id="cote-droite">
        <span>Valider</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.5 14.5L12 8l6.5 6.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="poignee" aria-hidden="true"></div>
  </div>

</div>

<!-- La feuille de correction, qui monte du bas -->
<div class="feuille" id="feuille" data-t="juste"></div>

<!-- Le resultat de chaque question est annonce ici (section 7.9). -->
<div class="invisible" id="qcm-annonce" role="status" aria-live="polite"></div>

<!-- Sans JavaScript, le geste n'existe pas : on le dit, on ne laisse pas
     une page vide. -->
<noscript>
  <div style="padding:26px 20px">
    <p class="t-page">Le QCM a besoin de JavaScript</p>
    <p style="margin-top:12px">Il se joue en faisant glisser des cartes au doigt&nbsp;;
    sans JavaScript, ce geste n'existe pas. <a href="index.html">Retour à l'accueil</a>.</p>
  </div>
</noscript>

<script src="js/icones.js"></script>
<script src="js/geometrie.js"></script>
<script src="js/photo.js"></script>
<script src="js/memoire.js"></script>
<script src="js/geste.js"></script>
<script src="js/qcm.js"></script>
<script src="js/lancer-qcm.js"></script>
</body>
</html>
