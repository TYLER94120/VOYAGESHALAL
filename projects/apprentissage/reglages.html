<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Régler ton QCM — Islam pas à pas</title>
<meta name="description" content="Choisis le nombre de questions, de 20 à 100, et le moment de la correction : après chaque question, ou tout à la fin.">
<meta name="theme-color" content="#FAF7F0">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap"></noscript>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/reglages.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%274%27 fill=%27%230B3D26%27/%3E%3Cpath d=%27M12 1.6l2.7 5 5.6-2.5-2.5 5.6 5 2.7-5 2.7 2.5 5.6-5.6-2.5-2.7 5-2.7-5-5.6 2.5 2.5-5.6-5-2.7 5-2.7-2.5-5.6 5.6 2.5z%27 fill=%27none%27 stroke=%27%23C9A227%27 stroke-width=%271.4%27/%3E%3C/svg%3E">
</head>
<body>

<div class="ecran">
  <div class="corps" id="principal" style="padding-bottom:120px">

    <div class="tete">
      <a class="pastille" href="sections.html" aria-label="Revenir aux sections">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="#55635B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <div class="pile-9">
      <h1 class="t-page" id="titre">Régler ton QCM</h1>
      <p class="c-meta" id="sous">Chargement…</p>
    </div>

    <!-- Nombre de questions : cinq raccourcis + un curseur libre de 20 a 100,
         les deux synchronises. -->
    <div class="pile-11">
      <h2 class="t-bloc">Combien de questions ?</h2>
      <div class="raccourcis" id="raccourcis" role="group" aria-label="Nombre de questions">
        <button type="button" data-n="20">20</button>
        <button type="button" data-n="30">30</button>
        <button type="button" data-n="50">50</button>
        <button type="button" data-n="75">75</button>
        <button type="button" data-n="100">100</button>
      </div>
      <label class="invisible" for="curseur">Nombre de questions, de 20 à 100</label>
      <input type="range" id="curseur" min="20" max="100" step="1" value="20">
      <p class="c-meta" id="dit-nombre">20 questions</p>
    </div>

    <!-- Correction : quand ? -->
    <div class="pile-11">
      <h2 class="t-bloc">La correction, quand ?</h2>
      <div class="pile-11" id="modes" role="radiogroup" aria-label="Moment de la correction">
        <button type="button" class="mode" data-mode="apprentissage" role="radio" aria-checked="true">
          <span class="mode-nom">Mode apprentissage</span>
          <span class="mode-quoi">La correction tombe après chaque question, avec sa source.</span>
        </button>
        <button type="button" class="mode" data-mode="examen" role="radio" aria-checked="false">
          <span class="mode-nom">Mode examen</span>
          <span class="mode-quoi">Aucun indice pendant le jeu. Tout le corrigé à la fin.</span>
        </button>
      </div>
    </div>

    <!-- Options -->
    <div class="pile-11">
      <h2 class="t-bloc">Options</h2>
      <div class="pile" id="options"></div>
    </div>

  </div>

  <!-- Pied fixe : le bouton et l'estimation de duree -->
  <div class="pied-fixe">
    <button type="button" class="bouton bouton-vert" id="commencer">Commencer les 20 questions</button>
    <p class="c-meta" id="duree" style="text-align:center"></p>
  </div>
</div>

<script src="js/icones.js"></script>
<script src="js/memoire.js"></script>
<script src="js/reglages.js"></script>
</body>
</html>
